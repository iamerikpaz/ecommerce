{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section-content padding-y bg">
    <div class="container">

        <!-- ============================ COMPONENT 1 ================================= -->

        <div class="row">
            <aside class="col-lg-6">
                <div class="card">
            
                    <div class="card-body">
                        <h4 class="card-title mb-4">Dirección de envío</h4>
                        <form action="{% url 'place_order' %}" method="post">
                            {% csrf_token %}
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">Nombre(s)</label>
                                    <input type="text" name="first_name" class="form-control" required>
                                </div>
            
                                <div class="col form-group">
                                    <label for="">Apellidos</label>
                                    <input type="text" name="last_name" class="form-control" required>
                                </div>
            
                            </div>
            
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">Calle y número</label>
                                    <input type="text" name="address_line_1" class="form-control" required>
                                </div>
                            </div>
            
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">Código Postal</label>
                                    <input type="text" name="state" autocomplete="address-level3" class="form-control" maxlength="5"
                                        pattern="\d{5}" title="Por favor, ingrese exactamente 5 dígitos numéricos" required>
                                </div>
                                <div class="col form-group">
                                    <label for="">Colonia</label>
                                    <input type="text" name="address_line_2" id="address_line_2" class="form-control"
                                        autocomplete="address-line2">
                                </div>
            
                            </div>
            
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">Ciudad</label>
                                    <input type="text" name="city" class="form-control" required>
                                </div>
                                <div class="col form-group">
                                    <label for="">Teléfono</label>
                                    <input type="tel" name="phone" id="phone" class="form-control" pattern="[0-9]{10}"
                                        maxlength="10" inputmode="numeric" title="Debe contener 10 dígitos numéricos">
                                </div>
                            </div>
            
                            <div class="form-row">
                                <label for="">Referencias del domicilio</label>
                                <textarea name="order_note" rows="2" class="form-control" required></textarea>
                            </div>
            
            
                            <hr>
                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" id="quiereFactura" name="quiere_factura">
                                <label class="form-check-label" for="quiereFactura">
                                    ¿Deseas factura?
                                </label>
                            </div>
            
                            <div id="facturaFields" style="display: none;">
                                <div class="form-group">
                                    <label for="rfc">RFC</label>
                                    <input type="text" name="rfc" id="rfc" class="form-control" placeholder="Ej. ABC123456T12"
                                        minlength="12" maxlength="14" pattern="[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{2,3}"
                                        title="Debe contener entre 12 y 14 caracteres válidos (letras y números)">
                                </div>
            
                                <div class="form-group">
                                    <label for="razon_social">Nombre o Razón Social</label>
                                    <input type="text" name="razon_social" id="razon_social" class="form-control"
                                        placeholder="Nombre o empresa">
                                </div>
                                <!--                     
                                    <div class="form-group">
                                        <label for="regimen_fiscal">Régimen Fiscal</label>
                                        <input type="text" name="regimen_fiscal" id="regimen_fiscal" class="form-control"
                                            placeholder="Ej. 601 - General de Ley Personas Morales">
                                    </div>
              -->
                                <div class="form-group">
                                    <label for="regimen_fiscal">Régimen Fiscal</label>
                                    <select name="regimen_fiscal" id="regimen_fiscal" class="form-control">
                                        <option value="" selected disabled>Selecciona tu régimen</option>
                                
                                        <option value="601" data-persona="M">601 - General de Ley Personas Morales</option>
                                        <option value="603" data-persona="M">603 - Personas Morales con Fines no Lucrativos</option>
                                        <option value="605" data-persona="F">605 - Sueldos y Salarios</option>
                                        <option value="606" data-persona="F">606 - Arrendamiento</option>
                                        <option value="607" data-persona="F">607 - Enajenación o Adquisición de Bienes</option>
                                        <option value="608" data-persona="F">608 - Demás ingresos</option>
                                        <option value="610" data-persona="A">610 - Residentes en el Extranjero sin EP en México</option>
                                        <option value="611" data-persona="F">611 - Ingresos por Dividendos</option>
                                        <option value="612" data-persona="F">612 - PF con Actividades Empresariales y Profesionales</option>
                                        <option value="614" data-persona="F">614 - Ingresos por intereses</option>
                                        <option value="615" data-persona="F">615 - Ingresos por obtención de premios</option>
                                        <option value="616" data-persona="F">616 - Sin obligaciones fiscales</option>
                                        <option value="620" data-persona="M">620 - Sociedades Cooperativas de Producción</option>
                                        <option value="621" data-persona="F">621 - Incorporación Fiscal</option>
                                        <option value="622" data-persona="M">622 - Actividades Agrícolas, Ganaderas, Silvícolas y Pesqueras</option>
                                        <option value="623" data-persona="M">623 - Opcional para Grupos de Sociedades</option>
                                        <option value="624" data-persona="M">624 - Coordinados</option>
                                        <option value="625" data-persona="F">625 - Actividades vía Plataformas Tecnológicas</option>
                                        <option value="626" data-persona="A">626 - Régimen Simplificado de Confianza</option>
                                    </select>
                                
                                </div>
                                <div class="form-group">
                                    <label for="uso_cfdi">Uso CFDI</label>
                                    <select name="uso_cfdi" id="uso_cfdi" class="form-control">
                                        <option value="" selected disabled>Selecciona el uso del CFDI</option>
                                
                                        <option value="G01" data-regimen="601,603,606,612,620,621,622,623,624,625,626">G01 - Adquisición de mercancías
                                        </option>
                                        <option value="G02" data-regimen="601,603,606,612,616,620,621,622,623,624,625,626">G02 - Devoluciones, descuento
                                            o bonificaciones</option>
                                        <option value="G03" data-regimen="601,603,606,612,620,621,622,623,624,625,626">G03 - Gastos en general</option>
                                
                                        <option value="I01" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I01 - Construcciones</option>
                                        <option value="I02" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I02 - Mobiliario y equipo de
                                            oficina para inversiones</option>
                                        <option value="I03" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I03 - Equipo de transporte
                                        </option>
                                        <option value="I04" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I04 - Equipo de cómputo y
                                            accesorios</option>
                                        <option value="I05" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I05 - Dados, troqueles, moldes,
                                            matrices y herramental</option>
                                        <option value="I06" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I06 - Comunicaciones telefónicas
                                        </option>
                                        <option value="I07" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I07 - Comunicaciones satelitales
                                        </option>
                                        <option value="I08" data-regimen="601,603,606,612,620,621,622,623,624,625,626">I08 - Otra máquina y equipo
                                        </option>
                                        <option value="D01" data-regimen="605,606,608,611,612,614,607,615,625">D01 - Honorarios médicos, dentales y
                                            hospitalarios</option>
                                        <option value="D02" data-regimen="605,606,608,611,612,614,607,615,625">D02 - Gastos médicos por incapacidad o
                                            discapacidad</option>
                                        <option value="D03" data-regimen="605,606,608,611,612,614,607,615,625">D03 - Gastos funerales</option>
                                        <option value="D04" data-regimen="605,606,608,611,612,614,607,615,625">D04 - Donativos</option>
<!--                                         <option value="D05" data-regimen="605,606,608,611,612,614,607,615,625">D05 - Intereses reales pagados por
                                            créditos hipotecarios</option>
                                        <option value="D06" data-regimen="605,606,608,611,612,614,607,615,625">D06 - Aportaciones voluntarias al SAR
                                        </option>
                                        <option value="D07" data-regimen="605,606,608,611,612,614,607,615,625">D07 - Primas de seguros de gastos médicos
                                        </option>
                                        <option value="D08" data-regimen="605,606,608,611,612,614,607,615,625">D08 - Gastos de transportación escolar
                                            obligatoria</option>
                                        <option value="D09" data-regimen="605,606,608,611,612,614,607,615,625">D09 - Depósitos en cuentas para el
                                            ahorro, planes de pensiones</option>
                                        <option value="D10" data-regimen="605,606,608,611,612,614,607,615,625">D10 - Pagos por servicios educativos
                                            (colegiaturas)</option> -->
                                        <option value="S01" data-regimen="601,603,605,606,608,610,611,612,614,616,620,621,622,623,624,607,615,625,626">
                                            S01 - Sin efectos fiscales</option>
<!--                                         <option value="CP01" data-regimen="601,603,605,606,608,610,611,612,614,616,620,621,622,623,624,607,615,625,626">
                                            CP01 - Pagos</option>
                                        <option value="CN01" data-regimen="605">CN01 - Nómina</option>-->
                                    </select> 
                                </div>
 
                                <div class="form-group">
                                    <label for="calle">Calle y número</label>
                                    <input type="text" name="calle" id="calle" class="form-control">
                                </div>
            
                                <div class="form-row">
                                    <div class="col form-group">
                                        <label for="codigo_postal">Código Postal</label>
                                        <input type="text" name="codigo_postal" id="codigo_postal" class="form-control"
                                            maxlength="5" pattern="[0-9]{5}" inputmode="numeric" placeholder="Ej. 03100"
                                            title="Debe contener exactamente 5 dígitos numéricos">
                                    </div>
                                    <div class="col form-group">
                                        <label for="colonia">Colonia</label>
                                        <input type="text" name="colonia" id="colonia" class="form-control">
                                    </div>
                                </div>
            
                                <div class="form-group">
                                    <label for="ciudad">Ciudad</label>
                                    <input type="text" name="ciudad" id="ciudad" class="form-control">
                                </div>
            
                            </div>
                    </div>
                </div> <!-- card.// -->
            
            </aside> <!-- col.// -->
            <aside class="col-lg-6">

                <div class="card">
                    <div class="card-body">
                        <table class="table table-borderless table-shopping-cart">
                            <thead class="text-muted">
                                <tr class="small text-uppercase">
                                    <th scope="col">Producto(s)</th>
                                    <th scope="col" width="120">Cantidad</th>
                                    <th scope="col" width="120">Precio</th>

                                </tr>
                            </thead>
              <tbody>

              {% for cart_item in cart_items %}
              <tr>
                  <td>
                      <figure class="itemside align-items-center">
                          <div class="aside"><img src="{{ cart_item.product.images.url }}" class="img-sm"></div>
                          <figcaption class="info">
                              <a href="{{ cart_item.product.get_url }}" class="title text-dark">{{ cart_item.product.product_name }}</a>

                              <p class="text-muted small">
                                {% if cart_item.variation.all %}
                                  {% for item in cart_item.variation.all %}
                                    {{ item.variation_category | capfirst }} : {{ item.variation_value | capfirst }} <br>
                                  {% endfor %}
                                {% endif %}
                              </p>
                          </figcaption>
                      </figure>
                  </td>
                  <td>

                    <label for="">{{ cart_item.quantity }}</label>

                  </td>
                  <td>
                      <div class="price-wrap">
                          <var class="price">${{ cart_item.sub_total }}</var>
                          <small class="text-muted"> ${{ cart_item.product.price }} cada uno </small>
                      </div> <!-- price-wrap .// -->
                  </td>

              </tr>
              {% endfor %}

              </tbody>
                        </table>

                        <button type="submit" name="submit" class="btn btn-primary btn-block"> Ordenar </button>
                        <a href="{% url 'store' %}" class="btn btn-light btn-block">Continuar comprando</a>
                        </form>
                    </div> <!-- card-body.// -->
                </div> <!-- card.// -->

            </aside> <!-- col.// -->


        </div> <!-- row.// -->
        <!-- ============================ COMPONENT 1 END .// ================================= -->
    </div> <!-- container .//  -->
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const checkbox = document.getElementById("quiereFactura");
    const facturaFields = document.getElementById("facturaFields");

    const requiredFields = [
      document.getElementById("rfc"),
      document.getElementById("razon_social"),
      document.getElementById("regimen_fiscal"),
      document.getElementById("uso_cfdi"),
      document.getElementById("calle"),
      document.getElementById("codigo_postal"),
      document.getElementById("colonia"),
      document.getElementById("ciudad"),
    ];

    function toggleFacturaFields(show) {
      facturaFields.style.display = show ? "block" : "none";

      requiredFields.forEach(field => {
        if (show) {
          field.setAttribute("required", "required");
        } else {
          field.removeAttribute("required");
        }
      });
    }

    checkbox.addEventListener("change", function () {
      toggleFacturaFields(this.checked);
    });

    // ✅ On page load, apply correct visibility/requirement
    toggleFacturaFields(checkbox.checked);
  });
    document.addEventListener("DOMContentLoaded", function () {
    const cpInput = document.getElementById("codigo_postal");
    if (cpInput) {
      cpInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 5); // Solo dígitos, máximo 5
      });
    }
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const selRegimen = document.getElementById('regimen_fiscal');
    const selUso = document.getElementById('uso_cfdi');

    if (selRegimen && selUso) {
      // Guarda todas las opciones iniciales (excepto el placeholder vacío)
      const allUso = Array.from(selUso.options).filter(o => o.value);

      function refreshUso() {
        const regimenValue = selRegimen.value; // p.ej. "605"
        const previous = selUso.value;

        // Limpiar y reponer placeholder
        selUso.innerHTML = '';
        const placeholder = new Option('Selecciona el uso del CFDI', '', true, false);
        placeholder.disabled = true;
        selUso.appendChild(placeholder);

        // Agregar solo los usos cuyo data-regimen incluya el régimen seleccionado
        allUso.forEach(opt => {
          const allowed = (opt.getAttribute('data-regimen') || '')
            .split(',')
            .map(s => s.trim())
            .filter(Boolean);
          if (allowed.includes(regimenValue)) {
            selUso.appendChild(opt.cloneNode(true));
          }
        });

        // Restaurar selección previa si aún es válida
        if ([...selUso.options].some(o => o.value === previous)) {
          selUso.value = previous;
        } else {
          selUso.value = '';
        }
      }

      selRegimen.addEventListener('change', refreshUso);
      if (selRegimen.value) refreshUso(); // Filtra en carga inicial
    }
  });
</script>


{% endblock %}
